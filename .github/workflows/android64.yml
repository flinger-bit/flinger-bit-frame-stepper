name: Build Geode Mod (AUTO)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Dependencies
      # =========================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git

      # =========================
      # 3. Clone Geode 4.x LOCKED
      # =========================
      - name: Clone Geode SDK
        run: |
          set -e

          git clone https://github.com/geode-sdk/geode.git geode-sdk
          cd geode-sdk
          git checkout v4.2.0
          cd ..

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # 4. AUTO PLATFORM DETECTION (KEY FIX)
      # =========================
      - name: Detect platform from SDK
        run: |
          set -e

          # 🔥 Let CMake decide platform automatically
          echo "GEODE_TARGET_PLATFORM=" >> $GITHUB_ENV

      # =========================
      # 5. Setup NDK
      # =========================
      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 6. Configure
      # =========================
      - name: Configure CMake
        run: |
          set -e

          mkdir -p build
          cd build

          cmake .. \
            -DGEODE_SDK=$GITHUB_WORKSPACE/geode-sdk \
            -DCMAKE_BUILD_TYPE=Release

      # =========================
      # 7. Build
      # =========================
      - name: Build
        run: |
          set -e
          cd build
          cmake --build .

      # =========================
      # 8. Upload artifact
      # =========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod
          path: build/*.geode
          if-no-files-found: error
