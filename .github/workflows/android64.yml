name: Build Android64 (Geode 4.x)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 2. FIX CLI en versión 4.x
      # =========================
      - name: Setup Geode CLI (v4 compatible)
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0   # ⚠️ esta es la última CLI compatible con 4.x

      # =========================
      # 3. Forzar SDK path
      # =========================
      - name: Configure SDK
        run: |
          set -e
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"

      # =========================
      # 4. Install SDK (SIN update)
      # =========================
      - name: Install Geode SDK 4.x
        run: |
          set -e

          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # 5. Binaries (4.x SAFE MODE)
      # =========================
      - name: Install SDK binaries
        run: |
          set -e

          # ⚠️ en 4.x esto debe ir SIN argumentos
          geode sdk install-binaries

      # =========================
      # 6. NDK
      # =========================
      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 7. Build Android64
      # =========================
      - name: Build mod
        run: |
          set -e

          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          geode build -p android64

      # =========================
      # 8. Upload artifact
      # =========================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mod-android64-geode4
          path: build-android64/*.geode
          if-no-files-found: error
