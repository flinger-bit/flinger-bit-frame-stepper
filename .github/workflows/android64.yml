name: Build Android64 (Geode)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Geode CLI (FIJO, NO latest random)
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # 3. Config SDK path (IMPORTANTE)
      - name: Configure Geode SDK path
        run: |
          set -e
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"

      # 4. Install SDK (SIN sdk update, SIN stable)
      - name: Install Geode SDK
        run: |
          set -e

          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # 5. Install Android binaries
      - name: Install Android binaries
        run: |
          set -e
          geode sdk install-binaries -p android64

      # 6. Set Android NDK
      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # 7. Build mod
      - name: Build mod
        run: |
          set -e
          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          geode build -p android64

      # 8. Upload artifact
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: build-android64/*.geode
          if-no-files-found: error
