name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      - name: Setup Geode config (FIX REAL)
        run: |
          set -euo pipefail

          # Crear config básica (esto faltaba)
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"
          geode config set default-platform android64

      - name: Create dummy profile (necesario sí o sí)
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/profile/geode/mods"
          geode profile add --name CI "$GITHUB_WORKSPACE/profile/GeometryDash.exe"

      - name: Install SDK
        run: |
          set -euo pipefail

          TARGET_GEODE_VERSION=$(jq -r '.geode' mod.json)

          echo "Using Geode $TARGET_GEODE_VERSION"

          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries -p android64

      - name: Build
        run: |
          set -euo pipefail
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          geode build -p android64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build-android64/*.geode
