name: Build Android64 (Geode 4.x HARD LOCK)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout mod repo
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Install dependencies
      # =========================
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git

      # =========================
      # 3. CLONE GEODE 4.x SDK (REAL LOCK)
      # =========================
      - name: Clone Geode SDK 4.2.0
        run: |
          set -e

          git clone https://github.com/geode-sdk/geode.git geode-sdk
          cd geode-sdk
          git checkout v4.2.0
          cd ..

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV
          echo "GEODE_TARGET_PLATFORM=android64" >> $GITHUB_ENV

      # =========================
      # 4. Setup Android NDK
      # =========================
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 5. CONFIGURE BUILD
      # =========================
      - name: Configure CMake
        run: |
          set -e

          mkdir -p build
          cd build

          cmake .. \
            -DGEODE_TARGET_PLATFORM=android64 \
            -DGEODE_SDK=$GITHUB_WORKSPACE/geode-sdk \
            -DCMAKE_BUILD_TYPE=Release

      # =========================
      # 6. BUILD
      # =========================
      - name: Build mod
        run: |
          set -e
          cd build
          cmake --build .

      # =========================
      # 7. ARTIFACT
      # =========================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64-4.2.0
          path: build/*.geode
          if-no-files-found: error
