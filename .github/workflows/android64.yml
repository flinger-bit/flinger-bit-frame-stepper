name: Build Geode (Auto Platform)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Install tools
      # =========================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git

      # =========================
      # 3. Clone Geode 4.x (LOCKED)
      # =========================
      - name: Clone Geode SDK 4.2.0
        run: |
          set -e

          git clone https://github.com/geode-sdk/geode.git geode-sdk
          cd geode-sdk
          git checkout v4.2.0
          cd ..

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # 4. Detect platform AUTOMATICALLY
      # =========================
      - name: Detect platform
        run: |
          set -e

          # Geode 4.x uses "android", NOT android64
          echo "GEODE_TARGET_PLATFORM=android" >> $GITHUB_ENV

      # =========================
      # 5. Setup Android NDK
      # =========================
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 6. Configure CMake
      # =========================
      - name: Configure
        run: |
          set -e

          mkdir -p build
          cd build

          cmake .. \
            -DGEODE_SDK=$GITHUB_WORKSPACE/geode-sdk \
            -DGEODE_TARGET_PLATFORM=android \
            -DCMAKE_BUILD_TYPE=Release

      # =========================
      # 7. Build
      # =========================
      - name: Build mod
        run: |
          set -e
          cd build
          cmake --build .

      # =========================
      # 8. Upload artifact
      # =========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: geode-mod-android
          path: build/*.geode
          if-no-files-found: error
