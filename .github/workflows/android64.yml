name: Build Android64 (Geode 4.x stable)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Setup Geode CLI (4.x compatible)
      # =========================
      - uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # =========================
      # 3. Setup SDK
      # =========================
      - name: Setup SDK
        run: |
          set -e
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"
          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # 4. Install binaries (NO ARGUMENTS)
      # =========================
      - name: Install binaries
        run: |
          set -e
          geode sdk install-binaries

      # =========================
      # 5. REAL BUILD STEP (FIX IMPORTANTE)
      # =========================
      - name: Build Android64
        run: |
          set -e

          # 🔥 EN GEODE 4.x NO existe "geode build"
          # el build se hace vía CMake/CLI action interno

          mkdir -p build
          cd build

          cmake .. -DGEODE_PLATFORM=android64
          cmake --build .

      # =========================
      # 6. Upload
      # =========================
      - uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: build/*.geode
          if-no-files-found: error
