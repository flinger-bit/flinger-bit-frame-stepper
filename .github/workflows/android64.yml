name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ CLI correcta para Geode 4.x
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # ✅ Config básica (evita errores de sdk-path)
      - name: Setup Geode config
        run: |
          set -euo pipefail
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"

      # ✅ Profile dummy (Geode lo exige)
      - name: Create profile
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/profile/geode/mods"
          geode profile add --name CI "$GITHUB_WORKSPACE/profile/GeometryDash.exe"

      # ✅ Instalar SDK correctamente (SIN usar versión directa)
      - name: Install SDK
        run: |
          set -euo pipefail

          echo "Installing Geode SDK..."

          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"
          geode sdk update stable
          geode sdk install-binaries -p android64

      # ✅ Build Android
      - name: Build Android64
        run: |
          set -euo pipefail

          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          geode build -p android64

      # ✅ Subir mod
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameStepper-Android64
          path: build-android64/*.geode
          if-no-files-found: error
