name: Build Android64 (Geode 4.x)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Geode CLI (4.x compatible)
      # =========================
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # =========================
      # SDK setup
      # =========================
      - name: Setup SDK
        run: |
          set -e

          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"
          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # Install binaries (IMPORTANT: NO args)
      # =========================
      - name: Install binaries
        run: |
          set -e
          geode sdk install-binaries

      # =========================
      # Setup Android NDK
      # =========================
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # Build (FIX REAL)
      # =========================
      - name: Build Android64
        run: |
          set -e

          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export GEODE_TARGET_PLATFORM=android64

          mkdir -p build
          cd build

          cmake ..
          cmake --build .

      # =========================
      # Upload artifact
      # =========================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64
          path: build/*.geode
          if-no-files-found: error
