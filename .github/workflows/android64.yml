name: Build Geode Mod (Windows CI → Android)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - uses: actions/checkout@v4

      # =========================
      # 2. Setup tools
      # =========================
      - name: Install tools
        shell: pwsh
        run: |
          choco install cmake ninja git -y

      # =========================
      # 3. Clone Geode 4.x LOCKED
      # =========================
      - name: Clone Geode SDK
        shell: pwsh
        run: |
          git clone https://github.com/geode-sdk/geode.git geode-sdk
          cd geode-sdk
          git checkout v4.2.0
          cd ..

          echo "GEODE_SDK=$env:GITHUB_WORKSPACE\geode-sdk" >> $env:GITHUB_ENV

      # =========================
      # 4. Setup Android NDK
      # =========================
      - name: Setup Android NDK
        shell: pwsh
        run: |
          echo "ANDROID_NDK_ROOT=$env:ANDROID_NDK_LATEST_HOME" >> $env:GITHUB_ENV

      # =========================
      # 5. FORCE ANDROID PLATFORM (CRÍTICO)
      # =========================
      - name: Set platform
        shell: pwsh
        run: |
          echo "GEODE_TARGET_PLATFORM=android" >> $env:GITHUB_ENV

      # =========================
      # 6. Configure CMake (Windows host, Android target)
      # =========================
      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build

          cmake .. `
            -G "Ninja" `
            -DGEODE_SDK="$env:GITHUB_WORKSPACE\geode-sdk" `
            -DGEODE_TARGET_PLATFORM=android `
            -DCMAKE_SYSTEM_NAME=Android `
            -DCMAKE_BUILD_TYPE=Release

      # =========================
      # 7. Build (HOST = Windows, TARGET = Android)
      # =========================
      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build .

      # =========================
      # 8. Upload artifact
      # =========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64
          path: build/*.geode
          if-no-files-found: error
