name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v3.7.4

      - name: Install SDK and Android binaries
        shell: bash
        run: |
          set -euo pipefail

          MOD_JSON_PATH="$(find . -name mod.json -not -path './geode-sdk-clone/*' -print | sort -r | head -n 1)"
          TARGET_GEODE_VERSION="$(jq -r '.geode' "$MOD_JSON_PATH")"

          echo "Using SDK version: $TARGET_GEODE_VERSION"
          echo "Using mod.json: $MOD_JSON_PATH"

          geode sdk install
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries -p android64

      - name: Build Android64
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_LATEST_HOME is not set on this runner"
            exit 1
          fi

          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          geode build -p android64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameStepper-Android64
          path: build-android64/*.geode
          if-no-files-found: error
