name: Build Android64 (Geode PRO)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 2. Setup CLI fijo
      # =========================
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # =========================
      # 3. SDK path (CRÍTICO)
      # =========================
      - name: Configure SDK
        run: |
          set -e
          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"

      # =========================
      # 4. Install SDK (SIN update)
      # =========================
      - name: Install SDK
        run: |
          set -e

          geode sdk install "$GITHUB_WORKSPACE/geode-sdk"

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV

      # =========================
      # 5. Install Android binaries (FIX REAL)
      # =========================
      - name: Install Android binaries
        run: |
          set -e

          geode sdk install-binaries android64

      # =========================
      # 6. Android NDK
      # =========================
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 7. Build
      # =========================
      - name: Build mod
        run: |
          set -e

          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          geode build -p android64

      # =========================
      # 8. Artifact
      # =========================
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mod-android64
          path: build-android64/*.geode
          if-no-files-found: error
