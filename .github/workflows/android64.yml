name: Build Android64 (GEODE 4.x LOCKED)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. FORCE GEODE 4.x CLI
      # =========================
      - name: Setup Geode CLI (pinned)
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v2.5.0

      # =========================
      # 3. HARD LOCK SDK VERSION (CRÍTICO)
      # =========================
      - name: Install Geode SDK 4.2.0 (LOCKED)
        run: |
          set -e

          geode config set sdk-path "$GITHUB_WORKSPACE/geode-sdk"

          # 🔒 FORCE EXACT VERSION
          geode sdk install --version 4.2.0 "$GITHUB_WORKSPACE/geode-sdk"

          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk" >> $GITHUB_ENV
          echo "GEODE_TARGET_PLATFORM=android64" >> $GITHUB_ENV

      # =========================
      # 4. INSTALL BINARIES (4.x SAFE MODE)
      # =========================
      - name: Install binaries (no args)
        run: |
          set -e
          geode sdk install-binaries

      # =========================
      # 5. ANDROID NDK
      # =========================
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # =========================
      # 6. BUILD (CMake 4.x compatible)
      # =========================
      - name: Build mod
        run: |
          set -e

          export GEODE_SDK="$GITHUB_WORKSPACE/geode-sdk"
          export GEODE_TARGET_PLATFORM=android64
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

          mkdir -p build
          cd build

          cmake .. \
            -DGEODE_TARGET_PLATFORM=android64 \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build .

      # =========================
      # 7. ARTIFACT
      # =========================
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: geode-android64-4.x
          path: build/*.geode
          if-no-files-found: error
